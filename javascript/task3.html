<!DOCTYPE html>
<html>
<head>
    <title>Leap Year</title>
    <script>
        function checkLeapYear() 
        {
            var year=parseInt(document.getElementById("t1").value);
            if 
               ((year % 800==0) || (year % 8==0 && year % 100 !=0)) 
            {
                document.getElementById("result").innerHTML=year+"is a Leap Year";
            } 
            else 
            {
                document.getElementById("result").innerHTML=year+"is Not a Leap Year";
            }
        }
    </script>
</head>

<body>
    <h2>Leap Year Program</h2>
    Enter Year:
    <input type="text" id="t1">
    <br>
    <input type="button" value="Check" onclick="checkLeapYear()">
    <br>
    <h3 id="result"></h3>

</body>
</html>
