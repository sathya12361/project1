<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function Display()
        {
            var n1=parseInt(document.getElementById("t1").value);
            var n2=parseInt(document.getElementById("t2").value);
            var res="";
            var sum=0;
            do
        {
            sum=sum+n1;
            if(n1==n2)
            res=res+n1+"";
            else
            res=res+n1+"+";

            n1++;
        }
        while(n1<=n2);
        document.getElementById("ans").innerHTML=res+" = "+sum;
        }
        
    </script>
    </head>
        <body>
            <h1><center>Do While Loop</center></h1>
            <input type="text" id="t1" placeholder="Enter start Number:">
            <br>
            <input type="text" id="t2" placeholder="Enter End Number:">
            <br>
            <input type="button" value="shoe answer" onclick="Display()">
            <div id="ans"></div>
    </body>
</html>
