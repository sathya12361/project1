<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function colors(){
            document.bgColor=event.target.value;
        }
    </script>
</head>
<body>
    <h1><center>change Background color:</center></h1>
    <lable>Select color:</lable>
<pre>
                      <input type="radio" onchange="colors()" name="col" value="red">Red
                      <input type="radio" onchange="colors()" name="col" value="green">green
                      <input type="radio" onchange="colors()" name="col" value="pink">Blue
            <input type="radio" onchange="colors()" name="col" value="yellow">Block

</pre>
        </body>
