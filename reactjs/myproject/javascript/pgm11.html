<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        var i=1;
        function  showimage()
        {
            if(i==1)
            document.getElementById("myimg").src="./images/birds.jpg";
            if(i==2)
            document.getElementById("myimg").src="./images/cat.jpg";
            if(i==3)
            document.getElementById("myimg").src="./images/flower.jpg";

            i++;
            if(i>=4)
            i=1;

           setTimeout(showimage,1000);
        }
        </script>
    </head>
    <body onload="showimage()">
       <center>
                <img style="border: 10px blue;" id="myimg" src="./images/birds.jpg" width="90%">
       </center>
    </body>
</html>
