<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width, intial=scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function dis()
        {
            var arr=[[11,22,33],[44,55,66],[77,88,99]];
            var sum=0;
            for(var i=0;i<3;i++)
        {
            for (var j=0;j<3;j++)
        {
            sum=sum+arr[i][j];
            document.write(" "+arr[i][j]); 

        }
        document.write(" = "+sum+"<br>");//rows total
        sum=0;
        }
        }
</script>
</head>
<body>
    <input type="number" placeholder="enter number" id="t1">
    <br>
    <button onclick="dis()">two dimensional array</button>

</body>
</html>
