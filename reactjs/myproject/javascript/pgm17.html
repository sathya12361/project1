<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function display()
        {
            var n1=parseInt(document.getElementById("t1").value);
            var n2=parseInt(document.getElementById("t2").value);
            var ans="";
            for(var i=n1;i<=n2;i++)
        {
            ans=ans+i+" ";
            if(i<=5)
            break;
        }
        document.getElementById("res").innerHTML=ans;

        }
         </script>
</head>
<body>
    <h1>jumping statement 1.continue 2.break</h1>
    <input type="text" id="t1" placeholder="Enter no.1"><br>
    <input type="text" id="t2" placeholder="Enter no.2"><br>
    <input type="button" value="continue test" onclick="display()">
    <br>
    <div id="res"></div>

</body>
</html>
